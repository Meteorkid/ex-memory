services:
  ex-memory:
    build: .
    image: ex-memory:online-experience
    container_name: ex-memory-online
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      METEOR_STORE_SSO_ENABLED: "true"
      METEOR_STORE_PROXY_TOKEN: ${METEOR_STORE_PROXY_TOKEN:?METEOR_STORE_PROXY_TOKEN is required}
      PUBLIC_BASE_PATH: /ex-memory-runtime
      DISABLE_REGISTRATION: "true"
      SINGLE_USER_MODE: "false"
      TRUSTED_PROXY: "true"
      CORS_ORIGINS: https://imagentx.top
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOCAL_WECHAT_HELPER_ENABLED: ${LOCAL_WECHAT_HELPER_ENABLED:-true}
      LOCAL_WECHAT_HELPER_VERSION: ${LOCAL_WECHAT_HELPER_VERSION:-0.1.0-beta.3}
      LOCAL_WECHAT_HELPER_MIN_API_VERSION: ${LOCAL_WECHAT_HELPER_MIN_API_VERSION:-1}
      LOCAL_WECHAT_HELPER_ARM64_URL: ${LOCAL_WECHAT_HELPER_ARM64_URL:-https://imagentx.top/downloads/ex-memory/0.1.0-beta.3/ex-memory-wechat-helper-0.1.0-beta.3-macos-arm64.dmg}
      LOCAL_WECHAT_HELPER_ARM64_SHA256: ${LOCAL_WECHAT_HELPER_ARM64_SHA256:-c1fa6dfb656997317a79300e5c8c40012756e8e92c49effa255d5cde556ba083}
    volumes:
      - ./data:/app/data
      - ./exes:/app/exes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
